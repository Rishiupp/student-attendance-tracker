<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSphere | Premium Student Portal</title>
    <!-- Outfit Font for modern premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="dashboard-container glass-panel">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap glow-icon"></i>
                <span>EduSphere</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <i class="fa-solid fa-users"></i> Students
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-chart-pie"></i> Analytics
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gear"></i> Settings
                </a>
            </nav>
            <div class="user-profile">
                <div class="avatar">A</div>
                <div class="user-info">
                    <p class="name">Admin User</p>
                    <p class="role">System Administrator</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search students...">
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openModal('addStudentModal')">
                        <i class="fa-solid fa-plus"></i> Add Student
                    </button>
                    <div class="theme-toggle">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="section-header">
                    <h2>Student Dashboard</h2>
                    <p>Real-time overview and roster management.</p>
                </div>
                
                <!-- Stats Overview -->
                <div class="stats-overview">
                    <div class="stat-card glass-panel-light">
                        <div class="stat-icon"><i class="fa-solid fa-user-graduate"></i></div>
                        <div class="stat-info">
                            <h3>Total Students</h3>
                            <p id="statTotalStudents">0</p>
                        </div>
                    </div>
                    <div class="stat-card glass-panel-light">
                        <div class="stat-icon purple"><i class="fa-solid fa-star"></i></div>
                        <div class="stat-info">
                            <h3>Average GPA</h3>
                            <p id="statAvgGPA">0.00</p>
                        </div>
                    </div>
                    <div class="stat-card glass-panel-light">
                        <div class="stat-icon green"><i class="fa-solid fa-book-open"></i></div>
                        <div class="stat-info">
                            <h3>Top Major</h3>
                            <p id="statTopMajor">-</p>
                        </div>
                    </div>
                </div>

                <div class="table-container glass-panel-light">
                    <table id="studentsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Student Name</th>
                                <th>Email Address</th>
                                <th>Major</th>
                                <th>GPA</th>
                                <th>Age</th>
                                <th>Address</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- Rows will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Student Modal -->
    <div class="modal-backdrop" id="studentModal">
        <div class="modal glass-panel">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Student</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" placeholder="e.g. John" required>
                        </div>
                        <div class="form-group half">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" placeholder="e.g. Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="john.doe@university.edu" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="major">Major</label>
                            <input type="text" id="major" placeholder="e.g. Computer Science" required>
                        </div>
                        <div class="form-group half">
                            <label for="gpa">GPA</label>
                            <input type="number" step="0.01" id="gpa" placeholder="e.g. 3.8" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="age">Age</label>
                            <input type="number" id="age" placeholder="e.g. 21" required>
                        </div>
                        <div class="form-group half">
                            <label for="address">Address</label>
                            <input type="text" id="address" placeholder="e.g. 123 Campus Dr" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveStudent()">Save Student</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast glass-panel"></div>

    <script src="app.js"></script>
</body>
</html>
